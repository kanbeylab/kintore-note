<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>トレーニングnote</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C2264F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トレーニングnote">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column. Pick a machine by its floor-map number, set the weight, tap once per finished set; the rest timer sits right under that button. History and progress are sibling views. */
:root{
  --bg:#FBF0F3; --surface:#FFFFFF; --sunken:#F6E0E6; --ink:#35131D; --muted:#7A5360; --line:#EBCCD5;
  --accent:#C2264F; --accent-ink:#FFFFFF; --accent-soft:#FBDBE4; --best:#A05E00; --best-soft:#FBEBCB; --warn:#9A3412; --warn-soft:#FDE6D2;
  --pin:#7D1D3F; --pin-ink:#FFFFFF;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1114; --surface:#2A1A1F; --sunken:#38232A; --ink:#F8E9ED; --muted:#CBA5B0; --line:#4D313A;
  --accent:#FF8FAB; --accent-ink:#3D0A1A; --accent-soft:#4A1F2C; --best:#F0B450; --best-soft:#3A2D12; --warn:#F6A66B; --warn-soft:#44240F;
  --pin:#F7A8BD; --pin-ink:#3D0A1A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1114; --surface:#2A1A1F; --sunken:#38232A; --ink:#F8E9ED; --muted:#CBA5B0; --line:#4D313A;
  --accent:#FF8FAB; --accent-ink:#3D0A1A; --accent-soft:#4A1F2C; --best:#F0B450; --best-soft:#3A2D12; --warn:#F6A66B; --warn-soft:#44240F;
  --pin:#F7A8BD; --pin-ink:#3D0A1A;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:.02em}
h2{font-size:16px;font-weight:700;margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunken);border-radius:999px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;border-radius:999px;min-height:42px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700}

.notice{border-radius:var(--r);padding:10px 14px;font-size:15px;background:var(--accent-soft)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:18px}

.daybar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}
.daybar button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.daybar button:disabled{opacity:.35;cursor:default}
.daybar .day{text-align:center;line-height:1.3}
.daybar .day strong{display:block;font-size:19px}

.rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{border:0;background:none;color:var(--accent);font-weight:500;padding:8px 4px;font-size:15px}
.link:disabled{opacity:.4;cursor:default}

.pin{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pin);color:var(--pin-ink);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:600;font-size:16px;line-height:1}
.machines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:460px){.machines{grid-template-columns:1fr}}
.machine{display:flex;align-items:center;gap:8px;min-height:54px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;text-align:left;font-size:16px;line-height:1.3;min-width:0}
.machine span:last-child{min-width:0;overflow-wrap:anywhere}
.machine[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.machine small,.menurow small{display:block;color:var(--muted);font-size:13px;font-weight:400;line-height:1.35}
.menu{display:flex;flex-direction:column}
.menurow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:58px;padding:6px 4px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;font-size:16px;line-height:1.3}
.menurow:first-child{border-top:0}
.menurow[aria-pressed="true"]{background:var(--accent-soft);border-radius:10px;border-top-color:transparent}
.menurow .st{font-size:14px;color:var(--muted);white-space:nowrap}
.menurow .st.ok{color:var(--accent);font-weight:700}
.next{min-height:50px;border-radius:14px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:16px;padding:6px 12px}
.machine.done::after{content:"✓";margin-left:auto;color:var(--accent);font-weight:700}

.last{background:var(--sunken);border-radius:12px;padding:10px 12px;font-size:15px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
@media (max-width:460px){.steppers{grid-template-columns:1fr}}
.stepper{display:flex;flex-direction:column;gap:6px;min-width:0}
.stepper label,.stepper .lab{font-size:14px;color:var(--muted);font-weight:500}
.stepper .ctl{display:grid;grid-template-columns:46px 1fr 46px;gap:6px}
.stepper button{height:54px;border-radius:12px;border:1px solid var(--line);background:var(--sunken);font-size:22px;line-height:1}
.stepper input{height:54px;min-width:0;width:100%;text-align:center;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-num);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums}
.stepper .link{height:auto;border:0;background:none;font-size:14px;padding:0 2px;line-height:1.6;white-space:nowrap}
.setcount{height:54px;border-radius:12px;background:var(--sunken);display:flex;align-items:center;justify-content:center}
.setcount .num{font-size:32px;line-height:1}
.primary{min-height:60px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;padding:8px 12px}
.primary:disabled{opacity:.45;cursor:default}

.timer{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.secs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.secs button{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-num);font-weight:600;font-size:22px}
.secs button small{font-family:var(--f-body);font-size:13px;font-weight:400;margin-left:1px}
.secs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.count{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sunken);border-radius:12px;padding:8px 8px 8px 16px}
.count.done{background:var(--best-soft);color:var(--best)}
.count .t{font-size:52px;line-height:1}
.count .m{font-size:15px;font-weight:700}
.count button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}

.itemrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto 40px;align-items:center;gap:8px;min-height:50px}
.itemrow + .itemrow{border-top:1px solid var(--line)}
.itemrow .name{font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.itemrow .v{font-size:22px;line-height:1.2;text-align:right;white-space:nowrap}
.itemrow .v small{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted);margin:0 4px 0 1px}
.badge{display:inline-block;background:var(--best-soft);color:var(--best);font-size:13px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.x{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:18px}
.empty{color:var(--muted);font-size:16px;text-align:center;padding:12px 4px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stat .k{font-size:13px;color:var(--muted)}
.stat .n{font-size:34px;line-height:1.1}
.stat .n small{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted);margin-left:3px}
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.daycard .ex{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;font-size:15px;align-items:center}
.daycard .ex .num{font-size:20px;white-space:nowrap}
textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:10px 12px;resize:vertical}
select{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}
.tabs.kind{grid-template-columns:repeat(2,1fr)}
.pgroup{display:flex;flex-direction:column;gap:8px}
.pgroup h3{margin:0;font-size:14px;font-weight:700;color:var(--muted)}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:6px 14px;font-size:15px;line-height:1.3;max-width:100%;overflow-wrap:anywhere;text-align:left}
.pchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.addopt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.addopt select{grid-column:1/-1}
.addopt input{height:50px;min-width:0;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
#pilList:not(:empty){border-top:1px solid var(--line);padding-top:12px}
.pilsum{display:flex;flex-direction:column;gap:6px}
.pilrow{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:8px;font-size:15px;align-items:baseline}
.chart svg{display:block;width:100%;height:auto}

.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
.toast div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;font-size:15px}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline;min-height:40px;padding:0 10px}
</style>

<div class="wrap">
  <header>
    <h1>トレーニングnote</h1>
    <span class="muted small" id="saveNote"></span>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-record" aria-selected="true" data-view="record">記録する</button>
    <button role="tab" id="tab-history" aria-selected="false" data-view="history">これまで</button>
    <button role="tab" id="tab-progress" aria-selected="false" data-view="progress">のび</button>
  </div>

  <div class="notice" id="notice" hidden></div>

  <section class="view" id="view-record">
    <div class="daybar">
      <button id="prevDay" aria-label="前の日">‹</button>
      <div class="day"><span class="muted small" id="dayLabel"></span><strong id="dayText"></strong></div>
      <button id="nextDay" aria-label="次の日">›</button>
    </div>
    <div class="tabs kind" role="tablist">
      <button role="tab" id="kind-gym" aria-selected="true" data-kind="gym">筋トレ</button>
      <button role="tab" id="kind-pil" aria-selected="false" data-kind="pil">ピラティス</button>
    </div>

    <div class="panel" id="pilPanel" hidden>
      <h2>先生のメニューを貼り付け</h2>
      <textarea id="pPaste" rows="4" placeholder="先生から届いたメニューをそのまま貼り付けます"></textarea>
      <button class="primary" id="pApply" type="button">貼り付けた内容を選択に反映</button>
      <div class="rowhead"><h2>やった種目</h2><span class="muted small" id="pCount"></span></div>
      <div id="pGroups" class="view"></div>
      <h2>選択肢を追加</h2>
      <form class="addopt" id="pAddForm">
        <select id="pGroup" aria-label="器具"></select>
        <input id="pName" type="text" maxlength="30" placeholder="種目名" autocomplete="off">
        <button class="next" type="submit">追加</button>
      </form>
      <label class="muted small" for="pNote">メモ（先生のひとこと、体の感じなど）</label>
      <textarea id="pNote" rows="3"></textarea>
    </div>


    <div class="panel" id="menuPanel">
      <div class="rowhead"><h2>おすすめメニュー</h2><span class="muted small" id="menuTime"></span></div>
      <div class="menu" id="menu"></div>
      <div class="muted small">10回×3セットを6種目。脚・胸・背中・お腹が毎回入り、前回やっていない機種を優先して入れ替えます。</div>
    </div>

    <div class="panel" id="formPanel">
      <div class="rowhead"><h2 id="formTitle">機種を選んでください</h2></div>
      <div class="last" id="last" hidden></div>

      <div class="steppers">
        <div class="stepper">
          <label for="weight" id="weightLabel">重さ（kg）</label>
          <div class="ctl"><button type="button" id="wMinus" aria-label="減らす">−</button><input id="weight" inputmode="decimal" value="20"><button type="button" id="wPlus" aria-label="増やす">＋</button></div>
        </div>
        <div class="stepper" id="setBox">
          <div class="rowhead"><span class="lab">セット数</span><button class="link" id="setMinus" type="button">1つ取り消す</button></div>
          <div class="setcount"><span class="num" id="setNum">0</span></div>
        </div>
      </div>
      <button class="primary" id="addSet" disabled>機種を選んでください</button>
      <button class="next" id="nextBtn" type="button" hidden></button>

      <div class="timer" id="timerBox">
        <h2>インターバル（休憩）</h2>
        <div class="secs" id="secs"></div>
        <div class="count" id="count" hidden>
          <div><div class="m" id="countMsg">休憩中</div><div class="t num" id="countT">0:30</div></div>
          <button type="button" id="stopTimer">止める</button>
        </div>
        <div class="bar" id="bar" hidden><i id="barFill"></i></div>
      </div>
    </div>

    <div class="panel">
      <h2 id="listTitle">この日の記録</h2>
      <div id="dayList"></div>
      <div id="pilList"></div>
      <button class="next" id="coachCopy" type="button" hidden>ヘルスコーチ用にコピー</button>
      <textarea id="coachText" rows="6" readonly hidden></textarea>
    </div>

    <div class="panel" id="machinesPanel">
      <div class="rowhead"><h2>すべての機種</h2><span class="muted small">番号はフロア図と同じです</span></div>
      <div class="machines" id="machines"></div>
    </div>
  </section>

  <section class="view" id="view-history" hidden>
    <div class="stats" id="stats"></div>
    <div class="view" id="historyList"></div>
    <div class="panel">
      <h2>バックアップ</h2>
      <div class="small" id="bkNote"></div>
      <button class="primary" id="bkCopy" type="button">記録をコピーする</button>
      <div class="muted small">コピーしたものをClaudeのチャットに貼り付けると、Notion日記に保存できます。</div>
      <textarea id="bkText" rows="4" placeholder="機種変更などで記録を戻すときは、コピーしておいた内容をここに貼り付けます"></textarea>
      <button class="next" id="bkLoad" type="button">貼り付けた記録を読み込む</button>
    </div>
  </section>

  <section class="view" id="view-progress" hidden>
    <div class="panel">
      <h2><label for="progEx">機種ごとの重さの移り変わり</label></h2>
      <select id="progEx"></select>
      <div class="chart" id="chart"></div>
      <div class="muted small" id="chartNote"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden><div><span id="toastMsg"></span><button id="toastUndo">元に戻す</button></div></div>

<script>
(function(){
/* Machines from the gym's floor map. no = map number; cardio = recorded in minutes. 15 (plate tree) is storage, not listed. */
const MACHINES=[
 {no:"1",name:"ランニングマシン",cardio:true,part:"有酸素・脚"},{no:"2",name:"アップライトバイク",cardio:true,part:"有酸素・脚"},
 {no:"3",name:"ラットプルダウン",part:"背中・腕"},{no:"4",name:"チェストプレス",part:"胸・肩・二の腕"},{no:"5",name:"ペックフライ",part:"胸"},{no:"6",name:"アブドミナル",part:"お腹"},
 {no:"7",name:"インナー/アウターサイ",part:"内もも・お尻の横"},{no:"8",name:"レッグカール",part:"もも裏"},{no:"9",name:"レッグエクステンション",part:"もも前"},{no:"10",name:"レッグプレス",part:"脚全体・お尻"},
 {no:"11",name:"デュアルプーリー",part:"動きで変わる（全身）"},{no:"12",name:"アジャスタブルベンチ",part:"ダンベルと組み合わせ"},{no:"13",name:"ダンベル",step:1,part:"腕・肩ほか"},
 {no:"16",name:"カールベンチ",part:"腕（力こぶ）"},{no:"17",name:"スミスマシン",part:"脚・胸ほか"},{no:"18",name:"パワーラック",part:"全身（上級向け）"}];
/* Menu: 6 guided machines per visit ≒ 30 min at 10 reps × 3 sets. Each slot rotates to whichever option was done longest ago. */
const TARGET_SETS=3,TARGET_REPS=10;
const SLOTS=[["レッグプレス","レッグエクステンション"],["チェストプレス","ペックフライ"],["ラットプルダウン"],["レッグカール","インナー/アウターサイ"],null,["アブドミナル"]];
const M=Object.fromEntries(MACHINES.map(m=>[m.name,m]));
const WD=["日","月","火","水","木","金","土"];
const LS="kintore-note-v2",LS_SEC="kintore-note-rest";
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const shift=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmtDay=s=>{const d=parse(s);return (d.getMonth()+1)+"月"+d.getDate()+"日（"+WD[d.getDay()]+"）"};
const fmtShort=s=>{const d=parse(s);return (d.getMonth()+1)+"/"+d.getDate()};
const fmtN=n=>String(Math.round(n*100)/100);
const isCardio=ex=>!!(M[ex]&&M[ex].cardio);
const fmtItem=it=>isCardio(it.ex)?fmtN(it.w)+"分":fmtN(it.w)+"kg × "+it.sets+"セット";
const pin=ex=>el("span","pin",M[ex]?M[ex].no:"–");

const S={mode:"loading",ready:false,days:new Map(),pil:new Map(),pilOpts:[],kind:"gym",date:ymd(new Date()),ex:null,view:"record",progEx:null};
let db=null,daysCol=null,loadTimer=null,undo=null,toastTimer=null;
const pending={},chain={};

function notice(msg,warn){const n=$("notice");if(!msg){n.hidden=true;return}n.textContent=msg;n.className="notice"+(warn?" warn":"");n.hidden=false}

/* ---------- storage ---------- */
const clean=items=>items.map(i=>({ex:String(i.ex),w:Number(i.w)||0,sets:Number(i.sets)||1}));
function fromOld(sets){const out=[];sets.forEach(s=>{const it=out.find(o=>o.ex===s.ex);if(it){it.sets++;it.w=Math.max(it.w,Number(s.w)||0)}else out.push({ex:String(s.ex),w:Number(s.w)||0,sets:1})});return out}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({days:[...S.days],pil:[...S.pil],pilOpts:S.pilOpts}))}catch(e){}}
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(LS)||"null");if(o){S.days=new Map(o.days||[]);S.pil=new Map(o.pil||[]);S.pilOpts=Array.isArray(o.pilOpts)?o.pilOpts:[]}}catch(e){}}
function writeFailed(e){notice(e&&e.code==="quota_exceeded"?"保存できる件数の上限に達しました。古い記録を消すと保存できます。":"保存できませんでした。通信状態を確かめて、もう一度お試しください。",true)}
function saveDay(date){
  if(S.mode==="local"){saveLocal();return}
  if(S.mode!=="db")return;
  pending[date]=(pending[date]||0)+1;
  chain[date]=(chain[date]||Promise.resolve()).then(()=>{
    if(pending[date]>1)return;
    const items=S.days.get(date),ref=daysCol.doc(date);
    return items&&items.length?ref.set({date:date,items:clean(items)}):ref.delete();
  }).catch(writeFailed).then(()=>{pending[date]--});
}
async function boot(){
  const use=window.claude&&window.claude.use?n=>window.claude.use(n).catch(()=>null):()=>Promise.resolve(null);
  const [d,user]=await Promise.all([use("db"),use("user")]);
  const uid=d&&user?await user.id():null;
  if(!d||!uid){
    S.mode="local";loadLocal();S.ready=true;
    $("saveNote").textContent="この端末にだけ保存";
    renderAll();return;
  }
  db=d;S.mode="db";
  daysCol=db.collection("data/users/"+uid).doc("log").collection("days");
  loadTimer=setTimeout(()=>{notice(S.ready?"最新の状態を確認できていません。表示が古いかもしれません。":"記録を読み込めていません。通信状態をご確認ください。",true)},10000);
  daysCol.limit(1000).onSnapshot(snap=>{
    const next=new Map();
    snap.docs.forEach(doc=>{const b=doc.data();if(!b)return;
      const items=Array.isArray(b.items)?clean(b.items):Array.isArray(b.sets)?fromOld(b.sets):[];
      if(items.length)next.set(doc.id,items)});
    for(const k in pending)if(pending[k]>0){if(S.days.has(k))next.set(k,S.days.get(k));else next.delete(k)}
    S.days=next;S.ready=true;
    if(!snap.metadata.fromCache){clearTimeout(loadTimer);notice("")}
    $("saveNote").textContent="自動で保存されます";
    renderAll();
  },()=>{clearTimeout(loadTimer);notice("記録を読み込めませんでした。ページを開き直してみてください。",true)});
}

const PIL_GROUPS=["リフォーマー","マット","チェア","タワー","バレル","準備・その他"];
const PIL_PRESET={
 "リフォーマー":["フットワーク","レッグワーク","アームワーク","ストマックマッサージ","ロールバック&アップ","マーメイド","イヴズランジ","ITBストレッチ","プルストラップ","ハンドレッド","コーディネーション","ショートスパイン","ロングストレッチ","エレファント","ニーストレッチ","ショートボックス","ロングボックス","ローイング","ランニング","ペルビックリフト","サイドスプリット"],
 "マット":["ASブリッジ","キャットストレッチ","ハンドレッド","ロールアップ","シングルレッグストレッチ","ダブルレッグストレッチ","スパインストレッチ","ソウ","スワン","サイドキック","ショルダーブリッジ","スイミング","プランク"],
 "チェア":["マーメイド","フットワーク","スワン","プッシュダウン","マウンテンクライマー"],
 "タワー":["キャットストレッチ","ヒップオープナー","ロールダウン","レッグスプリング","アームスプリング","プッシュスルー"],
 "バレル":["ロールダウン&アップ","スワン","サイドストレッチ","サイドシットアップ"],
 "準備・その他":["胸椎ストレッチ","呼吸練習"]};
const pnorm=s=>s.replace(/[＆&]|and|アンド/gi,"&").replace(/[\s　]/g,"").toLowerCase();
const pilDay=()=>S.pil.get(S.date)||{items:[],note:""};
const pilOptions=g=>{const base=PIL_PRESET[g]||[];return base.concat(S.pilOpts.filter(o=>o.a===g&&!base.includes(o.n)).map(o=>o.n))};
const allDates=()=>[...new Set([...S.days.keys(),...[...S.pil].filter(([d,p])=>p.items.length||p.note).map(([d])=>d)])].sort();

function pilToggle(a,n){

  if(items.length===d.items.length)items.push({a:a,n:n});

}
function pilGroupOf(s){
  const t=s.replace(/[\s　]/g,"");
  if(/キャデラック/.test(t))return "タワー";
  if(/スパインコレクター/.test(t))return "バレル";
  return PIL_GROUPS.slice(0,5).find(g=>t.indexOf(g)>=0)||null;
}
/* Find or create the option; returns {a,n,isNew}. */
function pilResolve(group,name){
  let g=group;
  if(!g)g=PIL_GROUPS.find(x=>pilOptions(x).some(n=>pnorm(n)===pnorm(name)))||"準備・その他";
  const hit=pilOptions(g).find(n=>pnorm(n)===pnorm(name));
  if(hit)return {a:g,n:hit,isNew:false};
  S.pilOpts.push({a:g,n:name});return {a:g,n:name,isNew:true};
}
function pilParse(text){
  let cur=null;const found=[];let added=0;
  text.split(/\r?\n/).forEach(raw=>{
    let line=raw.trim();if(!line)return;
    if(/^\[?\d{1,2}[:：]\d{2}\]?$/.test(line))return;
    const h=line.match(/^[（(【＜<]\s*(.+?)\s*[）)】＞>]$/);
    if(h){cur=pilGroupOf(h[1])||"準備・その他";return}
    line=line.replace(/^[・･\-*●○◯\s　]+/,"");
    if(!line||/[！!。]$/.test(line)||/ありがとう|お疲れ|おつかれ|メニュー送|よろしく/.test(line))return;
    let g=cur;const m=line.match(/^(\S+?)[\s　]+(.+)$/);
    if(m&&pilGroupOf(m[1])&&m[1].length<=8){g=pilGroupOf(m[1]);line=m[2]}
    line.split(/[、,，]/).forEach(part=>{
      const name=part.trim().replace(/\d+$/,"").trim();
      if(!name||name.length>30)return;
      const r=pilResolve(g,name);if(r.isNew)added++;
      if(!found.some(f=>f.a===r.a&&f.n===r.n))found.push({a:r.a,n:r.n});
    });
  });
  return {found:found,added:added};
}

/* ---------- rest timer ---------- */
const T={sec:30,total:0,endAt:0,iv:null,doneTo:null,lock:null};
try{const v=parseInt(localStorage.getItem(LS_SEC),10);if([30,40,50,60].includes(v))T.sec=v}catch(e){}
let actx=null,osc=null,gain=null;
function cancelBeep(){try{if(osc){osc.onended=null;osc.stop()}}catch(e){}try{if(gain)gain.disconnect()}catch(e){}osc=gain=null}
function scheduleBeep(sec){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    actx=actx||new AC();actx.resume();cancelBeep();
    gain=actx.createGain();gain.gain.value=0;gain.connect(actx.destination);
    osc=actx.createOscillator();osc.type="sine";osc.frequency.value=880;osc.connect(gain);
    const t=actx.currentTime+sec;
    [0,.32,.64].forEach(d=>{gain.gain.setValueAtTime(.3,t+d);gain.gain.setValueAtTime(0,t+d+.18)});
    osc.start(t-.05);osc.stop(t+1);
  }catch(e){}
}
function renderSecs(){
  const box=$("secs");box.textContent="";
  [30,40,50,60].forEach(s=>{const b=el("button",null,s===60?"1":String(s));b.type="button";b.appendChild(el("small",null,s===60?"分":"秒"));
    b.setAttribute("aria-pressed",String(T.sec===s));b.setAttribute("aria-label","休憩"+(s===60?"1分":s+"秒"));
    b.onclick=()=>{T.sec=s;try{localStorage.setItem(LS_SEC,String(s))}catch(e){}renderSecs();renderMenu()};box.appendChild(b)});
}
function releaseLock(){try{if(T.lock)T.lock.release()}catch(e){}T.lock=null}
function startTimer(){
  stopTimer(true);
  T.total=T.sec;T.endAt=Date.now()+T.sec*1000;
  scheduleBeep(T.sec);
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(l=>{if(T.iv)T.lock=l;else l.release()}).catch(()=>{})}catch(e){}
  $("count").hidden=false;$("bar").hidden=false;$("count").classList.remove("done");
  $("countMsg").textContent="休憩中";$("stopTimer").textContent="止める";
  tick();T.iv=setInterval(tick,200);
}
function tick(){
  const left=Math.max(0,T.endAt-Date.now()),s=Math.ceil(left/1000);
  $("countT").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  $("barFill").style.width=(100*(1-left/(T.total*1000)))+"%";
  if(left<=0){
    clearInterval(T.iv);T.iv=null;releaseLock();
    $("count").classList.add("done");$("countMsg").textContent="休憩おわり。次のセットへ";$("stopTimer").textContent="閉じる";
    try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
    T.doneTo=setTimeout(()=>stopTimer(),15000);
  }
}
function stopTimer(keepBeep){
  clearInterval(T.iv);T.iv=null;clearTimeout(T.doneTo);releaseLock();
  if(!keepBeep)cancelBeep();
  $("count").hidden=true;$("bar").hidden=true;
}

  let at=null;try{at=localStorage.getItem(LS_BK)}catch(e){}
  const n=$("bkNote"),days=at?Math.floor((parse(ymd(new Date()))-parse(at))/864e5):null;
  n.textContent=!S.days.size?"記録はこのスマホの中に保存されています。":at?(days===0?"今日バックアップ済みです。":"前回のバックアップは"+days+"日前（"+fmtShort(at)+"）です。"+(days>=7?"そろそろコピーしておきましょう。":"")):"まだバックアップしていません。記録はこのスマホの中にだけあります。";
  n.style.color=S.days.size&&(!at||days>=7)?"var(--warn)":"var(--muted)";
}
function backupText(){return JSON.stringify({app:"kintore-note",exported:ymd(new Date()),days:sortedDates().map(d=>[d,clean(S.days.get(d))]),pil:[...S.pil],pilOpts:S.pilOpts})}
function renderHistory(){
  renderBackup();
  const dates=allDates().reverse(),now=new Date(),month=ymd(now).slice(0,7);
  const wk=new Date(now);wk.setDate(now.getDate()-((now.getDay()+6)%7));const wkStart=ymd(wk);
  const stats=$("stats");stats.textContent="";
  [["今週",dates.filter(d=>d>=wkStart).length],["今月",dates.filter(d=>d.startsWith(month)).length],["通算",dates.length]].forEach(([k,n])=>{
    const s=el("div","stat");s.appendChild(el("div","k",k));const v=el("div","n num",String(n));v.appendChild(el("small",null,"日"));s.appendChild(v);stats.appendChild(s)});
  const box=$("historyList");box.textContent="";
  if(!dates.length){box.appendChild(el("div","empty",S.ready?"ジムに行った日がここに新しい順で並びます。":"読み込み中…"));return}
  dates.forEach(d=>{
    const c=el("div","daycard"),head=el("div","rowhead");
    head.appendChild(el("h2",null,(parse(d).getFullYear()!==now.getFullYear()?parse(d).getFullYear()+"年":"")+fmtDay(d)));
    const open=el("button","link","開く");open.type="button";open.onclick=()=>{S.date=d;S.ex=null;S.kind=S.days.has(d)?"gym":"pil";setView("record")};head.appendChild(open);c.appendChild(head);
    (S.days.get(d)||[]).forEach(it=>{const r=el("div","ex");r.appendChild(pin(it.ex));r.appendChild(el("span",null,it.ex));r.appendChild(el("span","num",fmtItem(it)));c.appendChild(r)});
    const pp=S.pil.get(d);if(pp&&pp.items.length){const r=el("div","small");r.appendChild(el("strong",null,"ピラティス　"));r.appendChild(document.createTextNode(pp.items.map(i=>i.n).join("、")));c.appendChild(r)}
    box.appendChild(c);
  });
}

/* ---------- render: progress ---------- */
function renderProgress(){
  const sel=$("progEx"),used=new Set();S.days.forEach(items=>items.forEach(i=>used.add(i.ex)));
  const names=MACHINES.map(m=>m.name).filter(n=>used.has(n));used.forEach(n=>{if(!names.includes(n))names.push(n)});
  sel.textContent="";
  const chart=$("chart"),note=$("chartNote");chart.textContent="";note.textContent="";
  if(!names.length){sel.hidden=true;chart.appendChild(el("div","empty",S.ready?"記録が増えると、機種ごとに重さの移り変わりがグラフで見られます。":"読み込み中…"));return}
  sel.hidden=false;
  if(!names.includes(S.progEx))S.progEx=names.includes(S.ex)?S.ex:names[0];
  names.forEach(n=>{const o=el("option",null,(M[n]?M[n].no+"　":"")+n);o.value=n;o.selected=n===S.progEx;sel.appendChild(o)});
  const pts=[];sortedDates().forEach(d=>{const it=S.days.get(d).find(i=>i.ex===S.progEx);if(it)pts.push({d,v:it.w})});
  const unit=isCardio(S.progEx)?"分":"kg",vs=pts.map(p=>p.v),lo=Math.min(...vs),hi=Math.max(...vs);
  const W=320,H=180,L=52,R=14,Tp=16,B=28,ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("role","img");svg.setAttribute("aria-label",S.progEx+"の"+(unit==="分"?"時間":"重さ")+"の推移");
  const mk=(t,a,txt)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;svg.appendChild(e);return e};
  const x=i=>pts.length===1?(L+W-R)/2:L+(W-L-R)*i/(pts.length-1);
  const y=v=>hi===lo?(Tp+H-B)/2:Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo));
  (hi===lo?[hi]:[lo,hi]).forEach(v=>{mk("line",{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:"var(--line)","stroke-width":1,fill:"none"});
    mk("text",{x:L-8,y:y(v)+4,"text-anchor":"end","font-size":14,fill:"var(--muted)","font-family":"var(--f-num)"},fmtN(v)+unit)});
  if(pts.length>1){
    const line=pts.map((p,i)=>x(i)+","+y(p.v)).join(" ");
    mk("polygon",{points:L+","+(H-B)+" "+line+" "+(W-R)+","+(H-B),fill:"var(--accent-soft)",stroke:"none"});
    mk("polyline",{points:line,fill:"none",stroke:"var(--accent)","stroke-width":2.5,"stroke-linejoin":"round","stroke-linecap":"round"});
  }
  pts.forEach((p,i)=>mk("circle",{cx:x(i),cy:y(p.v),r:i===pts.length-1?5:3,fill:"var(--accent)",stroke:"var(--surface)","stroke-width":1.5}));
  mk("text",{x:pts.length===1?x(0):L,y:H-8,"text-anchor":pts.length===1?"middle":"start","font-size":14,fill:"var(--muted)","font-family":"var(--f-num)"},fmtShort(pts[0].d));
  if(pts.length>1)mk("text",{x:W-R,y:H-8,"text-anchor":"end","font-size":14,fill:"var(--muted)","font-family":"var(--f-num)"},fmtShort(pts[pts.length-1].d));
  chart.appendChild(svg);
  const diff=pts[pts.length-1].v-pts[0].v;
  note.textContent="記録 "+pts.length+"日・最高 "+fmtN(hi)+unit+(pts.length>1?"・はじめから "+(diff>0?"+":"")+fmtN(diff)+unit:"");
}

function setView(v){
  S.view=v;
  ["record","history","progress"].forEach(n=>{$("view-"+n).hidden=n!==v;$("tab-"+n).setAttribute("aria-selected",String(n===v))});
  renderAll();
}
function renderAll(){
  if(S.view==="record"){renderDay();renderKind();renderMachines();renderForm();renderPil();renderDayList()}
  else if(S.view==="history")renderHistory();
  else renderProgress();
}

/* ---------- events ---------- */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
$("prevDay").onclick=()=>{S.date=shift(S.date,-1);renderAll()};
$("nextDay").onclick=()=>{if(S.date<ymd(new Date())){S.date=shift(S.date,1);renderAll()}};
function step(dir){
  const inp=$("weight"),m=M[S.ex]||{},d=(m.cardio?5:m.step||2.5)*dir,min=m.cardio?1:0;
  const cur=parseFloat(String(inp.value).replace(",","."))||0;inp.value=fmtN(Math.max(min,Math.min(999,cur+d)));
}
$("wMinus").onclick=()=>step(-1);$("wPlus").onclick=()=>step(1);
$("addSet").onclick=completeSet;
$("setMinus").onclick=minusSet;
$("stopTimer").onclick=()=>stopTimer();
$("progEx").onchange=e=>{S.progEx=e.target.value;renderProgress()};
$("toastUndo").onclick=()=>{
  if(!undo)return;const items=(S.days.get(undo.date)||[]).slice();
  if(!items.some(i=>i.ex===undo.item.ex))items.splice(Math.min(undo.i,items.length),0,undo.item);
  S.days.set(undo.date,items);saveDay(undo.date);undo=null;$("toast").hidden=true;renderAll();
};

document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{S.kind=b.dataset.kind;renderKind();renderPil()});
$("pApply").onclick=()=>{
  const r=pilParse($("pPaste").value);
  if(!r.found.length){notice("種目を読み取れませんでした。メニューの部分を貼り付けてください。",true);return}
  const d=pilDay(),items=d.items.slice();r.found.forEach(f=>{if(!items.some(i=>i.a===f.a&&i.n===f.n))items.push(f)});
  $("pPaste").value="";pilSet(items,d.note);
  notice(r.found.length+"種目を選択しました。"+(r.added?"新しい種目を"+r.added+"件、選択肢に追加しました。":""));
};
$("pAddForm").addEventListener("submit",e=>{e.preventDefault();const n=$("pName").value.trim();if(!n)return;const r=pilResolve($("pGroup").value,n);$("pName").value="";const d=pilDay();if(!d.items.some(i=>i.a===r.a&&i.n===r.n))pilSet(d.items.concat([{a:r.a,n:r.n}]),d.note);else{saveLocal();renderPil()}});
$("pNote").addEventListener("change",()=>{const d=pilDay();pilSet(d.items,$("pNote").value.trim())});
$("coachCopy").onclick=()=>{
  const t=coachMessage(S.date),b=$("coachCopy"),box=$("coachText");
  const ok=()=>{b.textContent="コピーしました。ヘルスコーチに貼り付けてください";setTimeout(()=>{b.textContent="ヘルスコーチ用にコピー"},3000)};
  const fb=()=>{box.value=t;box.hidden=false;box.focus();box.select();notice("自動でコピーできませんでした。下の欄の文字を全部選んでコピーしてください。")};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
};
$("bkCopy").onclick=()=>{
  const t=backupText(),box=$("bkText"),done=()=>{try{localStorage.setItem(LS_BK,ymd(new Date()))}catch(e){}renderBackup();$("bkCopy").textContent="コピーしました";setTimeout(()=>{$("bkCopy").textContent="記録をコピーする"},2500)};
  const fallback=()=>{box.value=t;box.focus();box.select();notice("自動でコピーできませんでした。下の欄の文字を全部選んでコピーしてください。")};
  try{navigator.clipboard.writeText(t).then(done,fallback)}catch(e){fallback()}
};
$("bkLoad").onclick=()=>{
  try{
    const o=JSON.parse($("bkText").value.trim());if(!o||!Array.isArray(o.days))throw 0;
    let n=0;o.days.forEach(([d,items])=>{if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&Array.isArray(items)&&items.length){S.days.set(d,clean(items));n++}});
    if(Array.isArray(o.pil))o.pil.forEach(([d,v])=>{if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&v&&Array.isArray(v.items))S.pil.set(d,{items:v.items.filter(i=>i&&PIL_GROUPS.includes(i.a)&&i.n).map(i=>({a:i.a,n:String(i.n)})),note:String(v.note||"")})});
    if(Array.isArray(o.pilOpts))o.pilOpts.forEach(x=>{if(x&&PIL_GROUPS.includes(x.a)&&x.n&&!S.pilOpts.some(q=>q.a===x.a&&q.n===x.n))S.pilOpts.push({a:x.a,n:String(x.n)})});
    saveLocal();$("bkText").value="";notice(n+"日分の記録を読み込みました。");renderAll();
  }catch(e){notice("読み込めませんでした。コピーした内容をそのまま貼り付けてください。",true)}
};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

renderSecs();renderAll();
boot();
})();
</script>
